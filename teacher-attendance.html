<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Attendance | Madrasa Al Islahul Arabiya</title><style>body{margin:0;background:#edf3ed;font:16px/1.6 Arial,sans-serif;color:#173b2b}.card{max-width:490px;margin:8vh auto;padding:30px;background:white;border-radius:18px;box-shadow:0 6px 30px #1233}h1{font-size:24px;color:#153c2c}button{padding:14px 20px;border:0;border-radius:10px;background:#153c2c;color:white;font-weight:bold;margin:8px 4px 8px 0;cursor:pointer}button:disabled{opacity:.5}#mark{background:#287a50}#status{white-space:pre-wrap}img{width:90px}.attendance-choices{display:flex;flex-wrap:wrap;gap:7px}#absent{background:#a23b3b}#leave{background:#9b752c}#reasonBox{padding:15px;background:#f4f6ef;border-radius:12px;margin-top:12px}#reason{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bac8bb;border-radius:8px;font:inherit}#cancelReason{background:#6a7770}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style id="premium-font-refresh">body,button,input,select,textarea{font-family:'DM Sans',Arial,sans-serif!important}h1,h2,h3,.brand-title,.intro h1{font-family:'Playfair Display',Georgia,serif!important;letter-spacing:-.025em}p,li,label{line-height:1.65}button,.btn,nav a{letter-spacing:.01em}</style><style id="premium-ui-polish">
:root{--premium-gold:#b99a59;--premium-shadow:0 14px 38px rgba(15,46,32,.09)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{line-height:1.22;letter-spacing:-.025em}
h1{font-weight:700}h2,h3{font-weight:600}
button,.btn,a.back,input[type=submit]{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
button:not(:disabled):hover,.btn:hover,a.back:hover,input[type=submit]:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(12,48,37,.16)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--premium-gold);outline-offset:3px}
input:not([type=checkbox]):not([type=radio]),select,textarea{transition:border-color .2s,box-shadow .2s}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{border-color:var(--premium-gold);box-shadow:0 0 0 3px rgba(185,154,89,.12)}
.card{box-shadow:var(--premium-shadow);border:1px solid rgba(18,65,44,.07)}
nav a{transition:color .2s ease,opacity .2s ease}nav a:hover{opacity:.8}
@media(max-width:600px){h1{line-height:1.16}button,.btn{min-height:42px}}
@media(prefers-reduced-motion:reduce){button,.btn,a,input,select,textarea{transition:none!important}}
</style></head><body><main class="card"><img src="1_20261112_080707_0000.png" alt="Madrasa logo"><h1>Madrasa Al Islahul Arabiya</h1><h2>Teacher Daily Attendance</h2><p>Sign in with the Google account registered by the Principal. Mark attendance only when you join your class.</p><button id="login">Sign in with Google</button><button id="logout" hidden>Sign out</button><div id="details" hidden><p id="teacher"></p><p id="date"></p><div class="attendance-choices"><button id="mark">✓ Present</button><button id="absent" type="button">✕ Absent</button><button id="leave" type="button">🗓 Request Leave</button></div><div id="reasonBox" hidden><label for="reason">Reason (required)</label><textarea id="reason" maxlength="500" rows="3" placeholder="Please explain the reason"></textarea><button id="submitReason" type="button">Submit</button><button id="cancelReason" type="button">Cancel</button></div></div><p id="status" role="status"></p></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');const config=await fetch('firebase-config.json').then(r=>r.json());const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let teacher=null;
const dateToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('status').textContent='Sign in failed: '+e.message}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{$('details').hidden=true;teacher=null;$('login').hidden=!!user;$('logout').hidden=!user;if(!user){$('status').textContent='Please sign in.';return}if(!id){$('status').textContent='Invalid teacher link. Ask the Principal for your personal link.';return}try{const s=await getDoc(doc(db,'teacherAccess',id));if(!s.exists())throw Error('Teacher not found or Google email does not match.');teacher=s.data();if(String(teacher.email||'').toLowerCase()!==String(user.email||'').toLowerCase()){throw Error('Signed-in Google email ('+user.email+') does not match the teacher email registered by Principal ('+teacher.email+'). Sign out and use the correct teacher account.')}$('teacher').textContent='Teacher: '+teacher.name;$('date').textContent='Today: '+dateToday()+' (India time)';$('details').hidden=false;await refresh()}catch(e){$('status').textContent='Access denied: '+e.message}});
async function refresh(){if(!teacher)return;const date=dateToday(),s=await getDoc(doc(db,'teacherAttendance',id,'days',date));for(const key of ['mark','absent','leave'])$(key).disabled=s.exists();$('reasonBox').hidden=true;const data=s.exists()?s.data():null;$('status').textContent=data?'✓ Today’s attendance recorded: '+(data.status||'present').toUpperCase()+(data.reason?' — '+data.reason:''):'You have not marked attendance today. Select Present, Absent, or Leave Request.'}
$('mark').onclick=async()=>{if(!teacher)return;const date=dateToday();$('mark').disabled=true;$('status').textContent='Saving attendance…';try{await setDoc(doc(db,'teacherAttendance',id,'days',date),{date,teacherId:id,email:auth.currentUser.email,markedAt:serverTimestamp(),status:'present'});$('status').textContent='✓ Attendance submitted to the Admin Portal for '+date+'.';await refresh()}catch(e){$('mark').disabled=false;$('status').textContent='Attendance not saved: '+e.message+' | Signed in: '+auth.currentUser?.email+' | Teacher email: '+teacher?.email+'. Contact Principal.'}};
let attendanceChoice='';for(const choice of ['absent','leave'])$(choice).onclick=()=>{attendanceChoice=choice;$('reason').value='';$('reasonBox').hidden=false;$('reason').focus()};$('cancelReason').onclick=()=>{$('reasonBox').hidden=true};$('submitReason').onclick=async()=>{const reason=$('reason').value.trim();if(reason.length<5){$('status').textContent='Please enter a reason of at least 5 characters.';return}if(!teacher||!['absent','leave'].includes(attendanceChoice))return;const date=dateToday();$('submitReason').disabled=true;try{await setDoc(doc(db,'teacherAttendance',id,'days',date),{date,teacherId:id,email:auth.currentUser.email,markedAt:serverTimestamp(),status:attendanceChoice,reason,leaveStatus:attendanceChoice==='leave'?'pending':null});await refresh()}catch(e){$('status').textContent='Could not submit: '+e.message}finally{$('submitReason').disabled=false}};
</script></body></html>
