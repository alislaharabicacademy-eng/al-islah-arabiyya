<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Attendance | Madrasa Al Islahul Arabiya</title><style>body{margin:0;background:#edf3ed;font:16px/1.6 Arial,sans-serif;color:#173b2b}.card{max-width:490px;margin:8vh auto;padding:30px;background:white;border-radius:18px;box-shadow:0 6px 30px #1233}h1{font-size:24px;color:#153c2c}button{padding:14px 20px;border:0;border-radius:10px;background:#153c2c;color:white;font-weight:bold;margin:8px 4px 8px 0;cursor:pointer}button:disabled{opacity:.5}#mark{background:#287a50}#status{white-space:pre-wrap}img{width:90px}.attendance-choices{display:flex;flex-wrap:wrap;gap:7px}#absent{background:#a23b3b}#leave{background:#9b752c}#reasonBox{padding:15px;background:#f4f6ef;border-radius:12px;margin-top:12px}#reason{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bac8bb;border-radius:8px;font:inherit}#cancelReason{background:#6a7770}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style id="premium-font-refresh">body,button,input,select,textarea{font-family:'DM Sans',Arial,sans-serif!important}h1,h2,h3,.brand-title,.intro h1{font-family:'Playfair Display',Georgia,serif!important;letter-spacing:-.025em}p,li,label{line-height:1.65}button,.btn,nav a{letter-spacing:.01em}</style><style id="premium-ui-polish">
:root{--premium-gold:#b99a59;--premium-shadow:0 14px 38px rgba(15,46,32,.09)}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{line-height:1.22;letter-spacing:-.025em}
h1{font-weight:700}h2,h3{font-weight:600}
button,.btn,a.back,input[type=submit]{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
button:not(:disabled):hover,.btn:hover,a.back:hover,input[type=submit]:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(12,48,37,.16)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--premium-gold);outline-offset:3px}
input:not([type=checkbox]):not([type=radio]),select,textarea{transition:border-color .2s,box-shadow .2s}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{border-color:var(--premium-gold);box-shadow:0 0 0 3px rgba(185,154,89,.12)}
.card{box-shadow:var(--premium-shadow);border:1px solid rgba(18,65,44,.07)}
nav a{transition:color .2s ease,opacity .2s ease}nav a:hover{opacity:.8}
@media(max-width:600px){h1{line-height:1.16}button,.btn{min-height:42px}}
@media(prefers-reduced-motion:reduce){button,.btn,a,input,select,textarea{transition:none!important}}
</style></head><body><main class="card"><img src="1_20261112_080707_0000.png" alt="Madrasa logo"><h1>Madrasa Al Islahul Arabiya</h1><h2>Teacher Daily Attendance</h2><p>Sign in with the Google account registered by the Principal. Mark attendance only when you join your class.</p><button id="login">Sign in with Google</button><button id="logout" hidden>Sign out</button><div id="details" hidden><p id="teacher"></p><p id="date"></p><p>Mark each assigned subject separately. You can submit one subject at a time.</p><label for="classPicker">1. Select Class</label><select id="classPicker" style="display:block;width:100%;padding:13px;margin:10px 0"></select><label for="subjectPicker">2. Select Subject</label><select id="subjectPicker" style="display:block;width:100%;padding:13px;margin:10px 0"></select><div id="subjectList"></div></div><p id="status" role="status"></p></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');const config=await fetch('firebase-config.json').then(r=>r.json());const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let teacher=null,subjects=[],assignments=[];
const dateToday=()=>{const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>parts.find(x=>x.type===k).value;return get('year')+'-'+get('month')+'-'+get('day')};
$('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('status').textContent=e.message}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{$('details').hidden=true;teacher=null;$('login').hidden=!!user;$('logout').hidden=!user;if(!user){$('status').textContent='Please sign in.';return}if(!id){$('status').textContent='Missing teacher ID.';return}try{const s=await getDoc(doc(db,'teacherAccess',id));if(!s.exists())throw Error('Teacher not found');teacher=s.data();if(String(teacher.email||'').toLowerCase()!==String(user.email||'').toLowerCase())throw Error('Please use your registered Google account: '+teacher.email);const profile=await getDoc(doc(db,'teachers',id));const raw=profile.exists()?profile.data().subject||'':'';const roster=await getDoc(doc(db,'teacherRosters',id));assignments=roster.exists()?roster.data().assignments||[]:[];subjects=[...new Set((Array.isArray(raw)?raw:String(raw).split(/[,;\n]+/)).map(x=>String(x).trim()).filter(Boolean))];if(!subjects.length)subjects=['General Class'];$('teacher').textContent='Teacher: '+teacher.name;$('date').textContent='Today: '+dateToday()+' (India time)';$('details').hidden=false;setupClassPicker();await refresh()}catch(e){$('status').textContent='Access denied: '+e.message}});
function setupClassPicker(){const picker=$('classPicker');picker.replaceChildren();picker.add(new Option('Choose Class',''));for(const course of [...new Set(assignments.map(a=>a.course).filter(Boolean))])picker.add(new Option(({muallama:'Muallama',muballigha:'Muballigha',alima:'Alima','boys-hifz':'Boys Hifz Class'})[course]||course,course));picker.onchange=()=>{const subjectPicker=$('subjectPicker');subjectPicker.replaceChildren();subjectPicker.add(new Option('Choose Subject',''));for(const a of assignments.filter(a=>a.course===picker.value))subjectPicker.add(new Option(a.subject,a.subject));$('subjectList').replaceChildren()};$('subjectPicker').onchange=refresh}
async function refresh(){if(!teacher)return;const day=dateToday(),snap=await getDoc(doc(db,'teacherAttendance',id,'days',day)),data=snap.exists()?snap.data():{},saved=data.subjects||{};const root=$('subjectList');root.replaceChildren();const selectedCourse=$('classPicker').value,selectedSubject=$('subjectPicker').value;if(!selectedCourse||!selectedSubject){$('status').textContent='Select your class and subject to see the students.';return}for(const subject of subjects.filter(s=>s===selectedSubject)){const box=document.createElement('section');box.style.cssText='border:1px solid #d5e0d5;border-radius:12px;padding:14px;margin:12px 0';const heading=document.createElement('strong');heading.textContent=subject;box.append(heading);const assignment=assignments.find(a=>a.subject===subject&&a.course===selectedCourse)||{course:'',students:[]};const classInfo=document.createElement('p');classInfo.textContent='Class: '+(assignment.course||'Not assigned')+' · Students: '+assignment.students.length;box.append(classInfo);const current=saved[subject];if(current){const p=document.createElement('p');p.textContent='✓ '+current.status.toUpperCase()+(current.reason?' — '+current.reason:'')+' · Student attendance saved: '+Object.keys(current.students||{}).length;box.append(p)}else{const select=document.createElement('select');for(const [v,label] of [['present','🟢 Present'],['absent','🔴 Absent'],['leave','🟡 Leave Request']])select.add(new Option(label,v));select.style.cssText='display:block;width:100%;padding:12px;margin:10px 0';const reason=document.createElement('textarea');reason.placeholder='Reason required for Absent / Leave';reason.maxLength=500;reason.rows=2;reason.style.cssText='display:none;width:100%;box-sizing:border-box;padding:10px';select.onchange=()=>reason.style.display=select.value==='present'?'none':'block';const rosterBox=document.createElement('div');const picks=[];for(const student of assignment.students){const line=document.createElement('label');line.style.cssText='display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #e5eae5';const name=document.createElement('span');name.textContent=student.name;name.style.flex='1';const pick=document.createElement('select');pick.add(new Option('✓ Present','present'));pick.add(new Option('✕ Absent','absent'));line.append(name,pick);rosterBox.append(line);picks.push({student,pick})}const button=document.createElement('button');button.textContent='Submit '+subject+' + Student Attendance';button.onclick=async()=>{const status=select.value,why=reason.value.trim();if(status!=='present'&&why.length<5){$('status').textContent='Please enter a reason (at least 5 characters).';return}button.disabled=true;try{const path=doc(db,'teacherAttendance',id,'days',day);const currentSnap=await getDoc(path);const old=currentSnap.exists()?currentSnap.data():{};if(old.subjects?.[subject])throw Error('This subject is already marked today.');const students={};for(const {student,pick} of picks)students[student.id]={name:student.name,status:pick.value};const record={status,reason:status==='present'?'':why,leaveStatus:status==='leave'?'pending':null,course:assignment.course,students};await setDoc(path,{date:day,teacherId:id,email:auth.currentUser.email,markedAt:serverTimestamp(),subjects:{...(old.subjects||{}),[subject]:record}},{merge:true});$('status').textContent='✓ Saved '+subject;await refresh()}catch(e){$('status').textContent='Save failed: '+e.message}finally{button.disabled=false}};box.append(select,reason,rosterBox,button)}root.append(box)}$('status').textContent='Class: '+selectedCourse+' · '+subject+' · Saved today: '+Object.keys(saved).length+'.'}
</script></body></html>
