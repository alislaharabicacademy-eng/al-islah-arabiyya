<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Details | Madrasa Al Islahul Arabiya</title><style>body{margin:0;background:#f1f5f0;color:#183d2e;font:16px system-ui,Arial}header{background:#103c2d;color:white;padding:25px;text-align:center}header h1{margin:0;font-size:24px}nav a{color:#e9ca80;margin:0 12px}main{max-width:930px;margin:30px auto;padding:0 16px}.card{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 25px #1233;margin:18px 0}h2{color:#145339}label{display:block;font-weight:650;margin-top:16px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #b7c9bd;border-radius:8px;padding:12px;font:inherit;margin-top:6px}textarea{min-height:95px}button,.btn{display:inline-block;border:0;border-radius:9px;padding:12px 19px;background:#145339;color:white;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:10px 8px 0 0}.muted{color:#63736a}.notice{padding:12px;border-radius:9px;background:#fff5d9}ul{line-height:1.9}.hidden{display:none}footer{text-align:center;padding:25px;color:#516459}</style><style id="academy-logo-background-fix">img[src*="1_20261112_080707_0000.png"]{border-radius:50%!important;clip-path:circle(46% at 50% 50%)!important;background:#123f68!important;object-fit:cover!important}img[src*="1_20261112_080707_0000.png"]{box-shadow:none!important}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style id="premium-font-refresh">body,button,input,select,textarea{font-family:'DM Sans',Arial,sans-serif!important}h1,h2,h3,.brand-title,.intro h1{font-family:'Playfair Display',Georgia,serif!important;letter-spacing:-.025em}p,li,label{line-height:1.65}button,.btn,nav a{letter-spacing:.01em}</style><style id="premium-ui-polish">

</style></head><body><header><img src="1_20261112_080707_0000.png" alt="Academy logo" style="width:88px;height:88px;object-fit:contain;display:block;margin:0 auto 12px"><h1>MADRASA AL ISLAHUL ARABIYA</h1><p>Women's Online Madrasa · Course Details</p><nav><a href="index.html">Home</a><a href="admission.html">Admissions</a></nav></header><main><div class="card"><h2 id="name">Course Details</h2><p id="duration"></p><p id="description"></p><h2>Eligibility Criteria</h2><p id="eligibility"></p><h2>Kitabs / Books</h2><ul id="kitabs"></ul><h2>Syllabus</h2><p id="syllabus"></p><h2>Fees</h2><p id="fees"></p><h2>Class Timings</h2><p id="timings"></p><a class="btn" id="apply" href="admission.html">Apply for Admission →</a></div></main><footer>Madrasa Al Islahul Arabiya</footer><script>const defaults={"muallama":{"name":"Muallama","duration":"1 Year","description":"Foundational Islamic learning programme.","eligibility":"Eligibility criteria will be published by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"muballigha":{"name":"Muballigha","duration":"2 Years","description":"Two-year programme for continued Islamic study.","eligibility":"Eligibility criteria will be published by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"alima":{"name":"Alima","duration":"3 Years","description":"Extended programme for deeper Islamic learning.","eligibility":"Eligibility criteria will be published by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"boys-hifz":{"name":"Boys Hifz Class","duration":"To be announced","description":"Qur'an memorisation (Hifz) programme for boys. Full course details will be published soon.","eligibility":"Eligibility criteria will be announced by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"childrens-quran-maktab":{"name":"Children's Qur'an Maktab","duration":"","description":"","eligibility":"","kitabs":[],"syllabus":"","fees":"","timings":""},"tajweed-for-girls":{"name":"Tajweed For Girls","duration":"","description":"","eligibility":"","kitabs":[],"syllabus":"","fees":"","timings":""}};
const id=new URLSearchParams(location.search).get('course');
const d=defaults[id]||{name:'Course Details',kitabs:[]};
const isBaseCourse=['muallama','muballigha','alima','boys-hifz','childrens-quran-maktab','tajweed-for-girls'].includes(id);
function render(x){
 for(const k of ['name','duration','description','eligibility','syllabus','fees','timings'])document.getElementById(k).textContent=x[k]||'Details will be announced soon.';
 const ul=document.getElementById('kitabs');ul.replaceChildren();
 if(x.kitabs?.length){for(const book of x.kitabs){const li=document.createElement('li');li.textContent=book;ul.append(li)}}
 else{const li=document.createElement('li');li.textContent='Kitab list will be announced soon.';ul.append(li)}
 document.getElementById('apply').href='admission.html?course='+encodeURIComponent(x.name||d.name);
 document.getElementById('apply').hidden=false;
}
if(!id){document.querySelector('main').textContent='Choose a course from the academy.'}
else{
 if(isBaseCourse)render(d);
 else{document.getElementById('name').textContent='Loading course details…';document.getElementById('apply').hidden=true}
 window.addEventListener('course-ready',async()=>{
  try{
   const saved=await window.courseGet(id);
   if(saved&&saved.published===true)render({...d,...saved});
   else if(!isBaseCourse)document.querySelector('main').textContent='Course details are not published yet.';
  }catch(e){if(!isBaseCourse)document.querySelector('main').textContent='Unable to load course details right now.';console.warn('Course load unavailable',e)}
 });
}</script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const config=await fetch('firebase-config.json').then(r=>r.json()).catch(()=>({}));
const ready=Boolean(config.apiKey&&config.projectId&&config.appId);
window.courseStore=ready?getFirestore(initializeApp(config)):null;
window.courseGet=async id=>{if(!window.courseStore)return null;const s=await getDoc(doc(window.courseStore,'courses',id));return s.exists()?s.data():null};
window.dispatchEvent(new Event('course-ready'));
</script><script type="module" src="./academic-year.js"></script></body></html>
