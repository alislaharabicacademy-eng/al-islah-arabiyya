name: Grand Website Launch Trial Security

on:
  pull_request:
    paths:
      - 'grand-launch.html'
      - 'grand-launch.js'
      - 'principal-access-admin.js'
      - 'admin.html'
      - 'index.html'
      - 'firestore.rules'
      - 'tests/grand-launch-trial.test.mjs'
      - '.github/workflows/grand-launch-trial-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate JavaScript syntax
        run: |
          node --check grand-launch.js
          node --check principal-access-admin.js
          node --check tests/grand-launch-trial.test.mjs
      - name: Install test dependencies
        run: npm install --no-save firebase@13 @firebase/rules-unit-testing@6
      - name: Firestore emulator verifies administrator and principal permissions
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-grand-launch-trial 'node --test tests/grand-launch-trial.test.mjs'
