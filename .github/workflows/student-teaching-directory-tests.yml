name: Student Course Subject and Teacher Directory

on:
  pull_request:
    paths:
      - 'admin.html'
      - 'student-login.html'
      - 'teacher-login.html'
      - 'admin-student-preview.js'
      - 'student-account-admin.js'
      - 'student-teaching-admin.js'
      - 'student-teaching-utils.js'
      - 'tests/student-teaching-directory.test.mjs'
      - '.github/workflows/student-teaching-directory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-teaching-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify safe per-course / batch assignment selection
        run: node --test tests/student-teaching-directory.test.mjs
      - name: Verify module syntax and embedded student/admin scripts
        run: |
          node --check student-teaching-utils.js
          node --check student-teaching-admin.js
          node --check student-account-admin.js
          node --check admin-student-preview.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('student-login.html','admin.html','teacher-login.html'):
              src=Path(name).read_text()
              scripts=re.findall(r'<script type="module">([\s\S]*?)</script>',src)
              assert len(scripts)==1, name
              Path('/tmp/'+name+'.mjs').write_text(scripts[0])
          PY
          node --check /tmp/student-login.html.mjs
          node --check /tmp/admin.html.mjs
          node --check /tmp/teacher-login.html.mjs
