name: Academy Course and Student Fee Regression Checks
on:
  pull_request:
    paths:
      - 'admission.html'
      - 'existing-student-registration.html'
      - 'student-address-fields.js'
      - 'tests/student-address-forms.test.mjs'
      - 'admin.html'
      - 'admission-course-utils.js'
      - 'tests/admission-courses.test.mjs'
      - 'tests/student-fees.test.mjs'
      - 'fee-ledger-utils.js'
      - 'student-account-admin.js'
      - 'student-login.html'
      - 'premium-certificate-svg.js'
      - 'exam-documents.js'
      - 'tests/certificate-vector.test.mjs'
      - 'tests/student-profile-workflow.test.mjs'
      - 'tests/exam-batch-report.test.mjs'
      - 'courses.html'
      - 'course-eligibility.js'
      - 'tests/course-eligibility.test.mjs'
      - 'exam-batch-report.js'
      - 'exam-admin.js'
      - 'student-profile-requests.js'
      - 'student-update.html'
      - 'firestore.rules'
  push:
    branches: [main]
    paths:
      - 'admission.html'
      - 'existing-student-registration.html'
      - 'student-address-fields.js'
      - 'tests/student-address-forms.test.mjs'
      - 'admin.html'
      - 'admission-course-utils.js'
      - 'tests/admission-courses.test.mjs'
      - 'tests/student-fees.test.mjs'
      - 'fee-ledger-utils.js'
      - 'student-account-admin.js'
      - 'student-login.html'
      - 'premium-certificate-svg.js'
      - 'exam-documents.js'
      - 'tests/certificate-vector.test.mjs'
      - 'tests/student-profile-workflow.test.mjs'
      - 'tests/exam-batch-report.test.mjs'
      - 'courses.html'
      - 'course-eligibility.js'
      - 'tests/course-eligibility.test.mjs'
      - 'exam-batch-report.js'
      - 'exam-admin.js'
      - 'student-profile-requests.js'
      - 'student-update.html'
      - 'firestore.rules'
permissions:
  contents: read
jobs:
  admission-course-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Course Form Regression Checks
        run: node --test tests/admission-courses.test.mjs tests/student-fees.test.mjs tests/certificate-vector.test.mjs tests/student-profile-workflow.test.mjs tests/exam-batch-report.test.mjs tests/course-eligibility.test.mjs tests/student-address-forms.test.mjs
