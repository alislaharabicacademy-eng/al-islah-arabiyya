name: Private Admin Access Security

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'admin.html'
      - 'admin-access-setup.html'
      - 'tests/private-admin-access-rules.test.mjs'
      - '.github/workflows/private-admin-access-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('admin.html','admin-access-setup.html'):
              source=Path(name).read_text()
              snippets=re.findall(r'<script type="module">([\s\S]*?)</script>',source)
              assert snippets, f'No module scripts in {name}'
              Path('/tmp/'+name+'.mjs').write_text('\n'.join(snippets))
          PY
          node --check /tmp/admin.html.mjs
          node --check /tmp/admin-access-setup.html.mjs
          node --check tests/private-admin-access-rules.test.mjs
      - name: Install test dependencies
        run: npm install --no-save firebase@13 @firebase/rules-unit-testing@6
      - name: Verify Firestore grants and revocation in emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-private-admin-access 'node --test tests/private-admin-access-rules.test.mjs'
