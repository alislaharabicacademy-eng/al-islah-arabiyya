name: Audited Admin Teacher Preview Security

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'teacher-login.html'
      - 'tests/admin-teacher-preview-rules.test.mjs'
      - '.github/workflows/admin-teacher-preview-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate teacher login script syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('teacher-login.html').read_text()
          modules=re.findall(r'<script type="module">([\s\S]*?)</script>',html)
          assert modules
          assert 'adminPreview' in html
          assert 'teacher_dashboard_preview' in html
          assert 'syedatheil40@gmail.com' not in html
          Path('/tmp/teacher-login.mjs').write_text('\n'.join(modules))
          PY
          node --check /tmp/teacher-login.mjs
          node --check tests/admin-teacher-preview-rules.test.mjs
      - name: Install Firestore emulator tests
        run: npm install --no-save firebase@13 @firebase/rules-unit-testing@6
      - name: Check privileged access logging and teacher isolation
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-admin-teacher-preview 'node --test tests/admin-teacher-preview-rules.test.mjs'
