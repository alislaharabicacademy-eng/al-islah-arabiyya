name: Official Letter Pad - Tamil Arabic English A4
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'letterhead-studio.html'
      - 'letterhead-studio.js'
      - 'tests/letterhead-browser-print.mjs'
      - '.github/workflows/letterhead-print-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-multilingual-letterhead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ES module syntax and menu wiring
        run: |
          node --check --input-type=module < letterhead-studio.js
          node --check tests/letterhead-browser-print.mjs
          python3 - <<'PY'
          from pathlib import Path
          h=Path('letterhead-studio.html').read_text()
          a=Path('admin.html').read_text()
          j=Path('letterhead-studio.js').read_text()
          for x in ('value="en"','value="ta"','value="ar"','id="letterLanguage"'):
              assert x in h,x
          assert 'href="letterhead-studio.html"' in a
          assert 'isVerifiedAcademyAdmin' in j
          assert "import {isVerifiedMasterAdmin}" in Path('academy-admin-access.js').read_text()
          assert 'signatureData' in j
          assert 'id="includePrincipalSignature"' in h
          assert 'signatureChoiceLabel' in j
          assert 'without-signature' in h
          print('PASS language selectors, optional signature toggle and admin-only navigation')
          PY
      - name: Install Playwright controller and PDF tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-core
      - name: Start a local Academy site
        run: |
          python3 -m http.server 8767 >/tmp/letterhead-site.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8767/letterhead-studio.html >/dev/null
      - name: Create and inspect signed and unsigned A4 PDFs in three languages
        env:
          CHROME: /usr/bin/google-chrome
          PORT: '8767'
        run: |
          node tests/letterhead-browser-print.mjs
          python3 - <<'PY'
          import re,subprocess
          from pathlib import Path
          def images_in(pdf):
              images=subprocess.check_output(['pdfimages','-list',str(pdf)],text=True)
              return sum(bool(re.match(r'^\s*\d+\s+\d+',row)) for row in images.splitlines()[2:])
          for lang in ('en','ta','ar'):
              image_counts={}
              for signed in (False,True):
                  variant='signed' if signed else 'unsigned'
                  pdf=Path('letterhead-print-proof')/(lang+'-'+variant+'.pdf')
                  details=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
                  pages=int(re.search(r'^Pages:\s+(\d+)',details,re.M).group(1))
                  assert pages==1,(lang,variant,pages,'sample letter should fit one A4 page')
                  match=re.search(r'^Page size:\s+([\d.]+)\s+x\s+([\d.]+)\s+pts',details,re.M)
                  assert match,(lang,variant,details)
                  w,h=map(float,match.groups())
                  assert abs(w-595.28)<1 and abs(h-841.89)<1,(lang,variant,w,h)
                  selectable=subprocess.check_output(['pdftotext','-layout',str(pdf),'-'],text=True)
                  assert 'Madrasa Al Islahul Arabiya' in selectable,(lang,variant,'missing academy branding')
                  assert ('Test Principal' in selectable)==signed,(lang,variant,'principal name must only appear in signed mode')
                  assert len(selectable.strip())>100,(lang,variant,'missing selectable PDF text')
                  image_counts[variant]=images_in(pdf)
                  print('PASS',lang,variant,'A4',w,h,'points; principal text condition confirmed')
              assert image_counts['signed']>image_counts['unsigned'],(lang,'Signed PDF must contain signature image; unsigned must not',image_counts)
          PY
      - name: Upload Chrome PDF and screenshot proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-letterhead-english-tamil-arabic-pdfs
          path: letterhead-print-proof/
          retention-days: 7
