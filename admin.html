<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Admin | Madrasa Al Islahul Arabiya</title><style>body{margin:0;background:#f1f5f0;color:#183d2e;font:16px system-ui,Arial}header{background:#103c2d;color:white;padding:25px;text-align:center}header h1{margin:0;font-size:24px}nav a{color:#e9ca80;margin:0 12px}main{max-width:930px;margin:30px auto;padding:0 16px}.card{background:white;padding:24px;border-radius:16px;box-shadow:0 6px 25px #1233;margin:18px 0}h2{color:#145339}label{display:block;font-weight:650;margin-top:16px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #b7c9bd;border-radius:8px;padding:12px;font:inherit;margin-top:6px}textarea{min-height:95px}button,.btn{display:inline-block;border:0;border-radius:9px;padding:12px 19px;background:#145339;color:white;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:10px 8px 0 0}.muted{color:#63736a}.notice{padding:12px;border-radius:9px;background:#fff5d9}ul{line-height:1.9}.hidden{display:none}footer{text-align:center;padding:25px;color:#516459}</style></head><body><header><h1>COURSE ADMIN PANEL</h1><p>Madrasa Al Islahul Arabiya</p><nav><a href="index.html">Home</a><a href="courses.html?course=muallama">Course Preview</a></nav></header><main><div id="setup" class="card notice">Loading secure admin login…</div><div id="login" class="card hidden"><h2>Administrator Login</h2><p>Only the authorized madrasa Google account can publish changes.</p><button id="signIn">Sign in with Google</button></div><div id="editor" class="card hidden"><p id="signedIn"></p><button id="signOut">Sign out</button><h2>Edit Course</h2><label>Course<select id="course"><option value="muallama">Muallama — 1 Year</option><option value="muballigha">Muballigha — 2 Years</option><option value="alima">Alima — 3 Years</option><option value="boys-hifz">Boys Hifz Class</option></select></label><label>Course Name<input id="name" maxlength="100"></label><label>Duration<input id="duration" maxlength="60"></label><label>Description<textarea id="description"></textarea></label><label>Eligibility Criteria<textarea id="eligibility"></textarea></label><label>Kitab Names (one book per line)<textarea id="kitabs" style="min-height:170px"></textarea></label><label>Syllabus<textarea id="syllabus" style="min-height:150px"></textarea></label><label>Fees<input id="fees" maxlength="150"></label><label>Class Timings<input id="timings" maxlength="150"></label><label><input id="published" type="checkbox" style="width:auto"> Publish this course on the public website</label><button id="save">Save Changes</button><p id="status" role="status" aria-live="polite"></p></div></main><footer>Secure Course Management</footer><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const $=id=>document.getElementById(id),email='alislaharabicacademy@gmail.com';
const defaults={"muallama":{"name":"Muallama","duration":"1 Year","description":"Foundational Islamic learning programme.","eligibility":"Eligibility criteria will be published by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"muballigha":{"name":"Muballigha","duration":"2 Years","description":"Two-year programme for continued Islamic study.","eligibility":"Eligibility criteria will be published by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"alima":{"name":"Alima","duration":"3 Years","description":"Extended programme for deeper Islamic learning.","eligibility":"Eligibility criteria will be published by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""},"boys-hifz":{"name":"Boys Hifz Class","duration":"To be announced","description":"Qur'an memorisation (Hifz) programme for boys. Full course details will be published soon.","eligibility":"Eligibility criteria will be announced by the madrasa.","kitabs":[],"syllabus":"","fees":"","timings":""}};
const config=await fetch('firebase-config.json').then(r=>r.json()).catch(()=>({}));
if(!config.apiKey||!config.projectId||!config.appId){$('setup').textContent='Setup required: configure Firebase Authentication, Firestore, and firebase-config.json. No course changes can be published until setup is complete.'}else{
try{
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);
$('setup').classList.add('hidden');$('login').classList.remove('hidden');
$('signIn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$('setup').classList.remove('hidden');$('setup').textContent='Login failed: '+e.message}};
$('signOut').onclick=()=>signOut(auth);
let active=false;
onAuthStateChanged(auth,async user=>{active=!!user&&user.email?.toLowerCase()===email&&user.emailVerified;if(user&&!active){await signOut(auth);$('setup').classList.remove('hidden');$('setup').textContent='Access denied: this Google account is not authorized.'}else{$('setup').classList.add('hidden')}$('login').classList.toggle('hidden',active);$('editor').classList.toggle('hidden',!active);if(active){$('signedIn').textContent='Signed in as '+user.email;await load()}});
async function load(){const id=$('course').value;let data=defaults[id];try{const s=await getDoc(doc(db,'courses',id));if(s.exists())data={...data,...s.data()}}catch(e){$('status').textContent='Unable to load saved course: '+e.message}for(const k of ['name','duration','description','eligibility','syllabus','fees','timings'])$(k).value=data[k]||'';$('kitabs').value=(data.kitabs||[]).join('\n');$('published').checked=!!data.published}
$('course').onchange=load;
$('save').onclick=async()=>{if(!active)return;const id=$('course').value,data={};for(const k of ['name','duration','description','eligibility','syllabus','fees','timings'])data[k]=$(k).value.trim();data.kitabs=$('kitabs').value.split('\n').map(s=>s.trim()).filter(Boolean);data.published=$('published').checked;$('save').disabled=true;$('status').textContent='Saving…';try{await setDoc(doc(db,'courses',id),data);$('status').textContent='Saved successfully. Published courses are visible on the public Course Details page.'}catch(e){$('status').textContent='Save failed: '+e.message}finally{$('save').disabled=false}};
}catch(e){$('setup').classList.remove('hidden');$('setup').textContent='Firebase setup error: '+e.message}}
</script></body></html>
