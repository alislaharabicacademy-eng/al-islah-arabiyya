<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Courses | Madrasa Al Islahul Arabiya</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3e9;color:#173d2e;font-family:Arial,sans-serif}header{background:#0c3024;color:#f3dfaa;text-align:center;padding:26px 16px 32px;border-bottom:4px solid #b69a5b}header img{width:74px;height:74px;object-fit:contain}header h1{font-family:Georgia,serif;font-size:clamp(24px,5vw,38px);margin:10px 0}header p{color:#e6e4d8}nav a{color:#f1db9f;text-decoration:none;margin:0 12px}main{max-width:1100px;margin:auto;padding:35px 18px 70px}h2{text-align:center;font:normal 38px Georgia,serif;margin:8px 0 12px}.intro{text-align:center;color:#64776c;line-height:1.7;margin-bottom:35px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:22px}.card{background:#fff;border:1px solid #e2d8c4;border-radius:22px;padding:30px 24px;text-align:center;box-shadow:0 12px 28px #173d2e12}.icon{font-size:32px;color:#b69a5b}.card h3{font:normal 27px Georgia,serif;margin:15px 0;color:#123b2b}.duration{display:inline-block;background:#eaf0e9;border-radius:30px;padding:9px 20px;font-weight:bold;font-size:13px}.card p{line-height:1.7;color:#52695c;min-height:45px}.links{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:20px}.links a{background:#14533c;color:#fff;border-radius:10px;padding:12px 15px;text-decoration:none;font-weight:bold;font-size:13px}.links a:first-child{background:#f2f0e5;color:#174631}#status{text-align:center;color:#586c60;margin:20px}footer{text-align:center;background:#0c3024;color:#eadab4;padding:24px}@media(max-width:600px){main{padding-top:26px}}</style><style id="luxury-course-card-motion">
@keyframes academyCardReveal{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
#homepageCourseGrid .course-card,.grid .card{position:relative;overflow:hidden;animation:academyCardReveal .7s cubic-bezier(.2,.75,.25,1) both;transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease}
#homepageCourseGrid .course-card:nth-child(2),.grid .card:nth-child(2){animation-delay:.12s}
.grid .card:nth-child(3n){animation-delay:.18s}
#homepageCourseGrid .course-card::before,.grid .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 25%,rgba(196,163,94,.13) 49%,transparent 72%);transform:translateX(-130%);transition:transform .8s ease}
#homepageCourseGrid .course-card:hover,.grid .card:hover{transform:translateY(-8px);border-color:#c7aa70;box-shadow:0 20px 42px rgba(13,55,39,.16)}
#homepageCourseGrid .course-card:hover::before,.grid .card:hover::before{transform:translateX(130%)}
#homepageCourseGrid .course-card a,.grid .card a{transition:background .25s ease,color .25s ease,transform .25s ease}
#homepageCourseGrid .course-card a:hover,.grid .card a:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){#homepageCourseGrid .course-card,.grid .card{animation:none!important;transition:none!important}#homepageCourseGrid .course-card::before,.grid .card::before{display:none}}
</style></head><body><header><img src="1_20261112_080707_0000.png" alt="Academy logo"><h1>Madrasa Al Islahul Arabiya</h1><p>Women's Online Madrasa</p><nav><a href="index.html">← Home</a><a href="admission.html">Apply Now</a></nav></header><main><h2>Explore All Courses</h2><p class="intro">Discover the Islamic learning programmes offered by our academy.</p><div class="grid" id="grid"></div><p id="status" aria-live="polite">Loading available courses…</p></main><footer>© Madrasa Al Islahul Arabiya</footer><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
import{getFirestore,collection,getDocs,query,where}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const defaults=[{id:'muallama',name:'Muallama',description:'Foundational Islamic learning programme.'},{id:'muballigha',name:'Muballigha',description:'Islamic learning programme.'},{id:'alima',name:'Alima',description:'Advanced Islamic learning programme.'},{id:'boys-hifz',name:'Boys Hifz Class',description:'Qur’an memorisation programme for boys.'},{id:'childrens-quran-maktab',name:"Children's Qur'an Maktab",description:'Qur’an learning for children.'},{id:'tajweed-for-girls',name:'Tajweed For Girls',description:'Qur’an recitation with Tajweed.'}];
const grid=document.getElementById('grid'),status=document.getElementById('status');
function add(d){const card=document.createElement('article');card.className='card';const icon=document.createElement('div');icon.className='icon';icon.textContent='✦';const title=document.createElement('h3');title.textContent=d.name;const desc=document.createElement('p');desc.textContent=d.description||d.shortDescription||'Online Islamic learning programme.';const links=document.createElement('div');links.className='links';const details=document.createElement('a');details.href='courses.html?course='+encodeURIComponent(d.id);details.textContent='More Details →';const apply=document.createElement('a');apply.href='admission.html?course='+encodeURIComponent(d.name);apply.textContent='Apply Now →';links.append(details,apply);card.append(icon,title,desc,links);grid.append(card)}
try{const cfg=await fetch('./firebase-config.json',{cache:'no-store'}).then(r=>r.json());const app=initializeApp(cfg,'all-courses-page');const snapshot=await getDocs(query(collection(getFirestore(app),'courses'),where('published','==',true)));const map=new Map(defaults.map(x=>[x.id,x]));snapshot.forEach(doc=>{const d=doc.data();if(d.name)map.set(doc.id,{...map.get(doc.id),...d,id:doc.id})});for(const d of map.values())add(d);status.textContent=''}catch(e){defaults.forEach(add);status.textContent='Additional courses could not be loaded right now. Please try refreshing.';console.warn(e)}
</script></body></html>
